name: release-train
# Historical release train. If main has new commits since the latest v* tag, it
# computes the next patch version and dispatches deploy.yml, which used to deploy,
# smoke-test, and self-tag the verified commit.
#
# Replaces the old per-merge release-on-dep-merge.yml: changes accumulate on main
# and ship in one batched release when an operator dispatches the train.
#
# DECOMMISSIONED (2026-09-04): there is no AWS application or data layer to
# release to. The workflow is disabled in GitHub and has no schedule. Rebuild the
# infrastructure and data, validate deploy.yml, and deliberately restore the
# trigger only if the product is brought back.
on:
  workflow_dispatch: {}    # allow a manual kick of the train

# Serialize manual kicks while this historical workflow remains in the tree.
concurrency: release-train

permissions:
  contents: read
  actions: write   # dispatch deploy.yml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # need all tags + history to compute the next version

      - name: Compute next patch version (skip if nothing new)
        id: ver
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          LATEST=${LATEST:-v0.0.0}
          # If the latest tag exists and points at HEAD's history with no commits
          # beyond it, there's nothing to release today.
          if git rev-parse -q --verify "refs/tags/${LATEST}" >/dev/null \
             && [ -z "$(git rev-list "refs/tags/${LATEST}..HEAD")" ]; then
            echo "No new commits since ${LATEST} — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r MAJ MIN PAT <<< "${LATEST#v}"
          NEXT="v${MAJ}.${MIN}.$((PAT + 1))"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing ${LATEST} -> ${NEXT}"

      - name: Dispatch deploy
        if: steps.ver.outputs.release == 'true'
        run: gh workflow run deploy.yml --ref main -f version="$NEXT"
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
